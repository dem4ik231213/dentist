{% extends "base.html" %}
{% block content %}
<div style="background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%); padding: 15px 20px 40px 20px; min-height: 100vh;">
  <div class="container" style="max-width: 480px; padding: 22px 28px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
    <div style="text-align: center; margin-bottom: 14px;">
      <h2 style="margin: 0; color: #2c3e50; font-size: 22px;">Реєстрація пацієнта</h2>
    </div>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group" style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 3px; font-weight: 500; color: #495057; font-size: 13px;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #dc3545; font-size: 12px; margin-top: 3px;">{{ field.errors }}</div>
                {% endif %}
                {% if field.help_text %}
                    <small style="color: #6c757d; font-size: 11px; display: block; margin-top: 2px;">{{ field.help_text|safe }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,123,255,0.25); margin-top: 4px;">Зареєструватись</button>
    </form>
    <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #e9ecef; text-align: center;">
      <p style="margin: 0; color: #6c757d; font-size: 13px;">
          Вже є акаунт? <a href="{% url 'login' %}" style="color: #007bff; font-weight: 500;">Увійти</a>
      </p>
    </div>
  </div>
</div>
<style>
    input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }
</style>
{% endblock %}
