{% extends "base.html" %}
{% block content %}
<div style="background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%); padding: 80px 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="container" style="max-width: 420px; padding: 30px 28px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
    <div style="text-align: center; margin-bottom: 22px;">
      <h2 style="margin: 0; color: #2c3e50; font-size: 24px;">Повторне надсилання</h2>
      <p style="color: #6c757d; margin: 6px 0 0 0; font-size: 13px;">Введіть email — надішлемо новий лист підтвердження</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 14px;">
            <label style="display: block; margin-bottom: 4px; font-weight: 500; color: #495057; font-size: 14px;">Email</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit" style="width: 100%; padding: 11px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,123,255,0.25); margin-top: 6px;">Надіслати лист повторно</button>
    </form>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #e9ecef; text-align: center;">
      <p style="margin: 0; color: #6c757d; font-size: 13px;">
          <a href="{% url 'login' %}" style="color: #007bff;">← Назад до входу</a>
      </p>
    </div>
  </div>
</div>

<style>
    input[type="email"] {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }
    input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }
</style>
{% endblock %}
