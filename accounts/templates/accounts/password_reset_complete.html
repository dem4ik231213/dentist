{% extends "base.html" %}
{% block content %}
<div style="background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%); padding: 80px 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="container" style="max-width: 420px; padding: 40px 28px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center;">
    <div style="font-size: 56px; margin-bottom: 15px;">✅</div>
    <h2 style="margin: 0 0 12px 0; color: #2c3e50; font-size: 24px;">Пароль змінено!</h2>
    <p style="color: #6c757d; margin: 0 0 25px 0; font-size: 14px;">Тепер ви можете увійти з новим паролем</p>
    <a href="{% url 'login' %}" style="display: inline-block; padding: 12px 32px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,123,255,0.25);">Увійти</a>
  </div>
</div>
{% endblock %}
